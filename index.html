<!doctype html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>節能營業中！</title>
    <style>
        :root {
            --brown: #4e3021;
            --wood: #865336;
            --cream: #fff2cd;
            --gold: #ffc34f;
            --green: #0c654e
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: #dcd2c2;
            color: #493222;
            font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif
        }

        button,
        a {
            font: inherit
        }

        button {
            cursor: pointer
        }

        .app {
            width: min(100%, calc(100dvh * .75), 810px);
            aspect-ratio: 3/4;
            min-height: 0;
            margin: auto;
            padding: 12px;
            background: #7a492c;
            border: 7px solid #412719;
            box-shadow: inset 0 0 0 4px #b47a4b;
            display: flex;
            flex-direction: column;
            gap: 10px
        }

        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(#704329, #452b1f);
            border: 3px solid #c28d50;
            border-radius: 8px;
            color: #ffe8b5;
            padding: 9px 12px;
            font-weight: 900;
            font-size: clamp(12px, 2vw, 19px)
        }

        .steps {
            display: flex;
            gap: 8px
        }

        .step {
            display: grid;
            place-items: center;
            width: clamp(30px, 5.1vw, 46px);
            height: clamp(30px, 5.1vw, 46px);
            background: #4e3329;
            color: #d8c2a5;
            border: 3px solid #2d211b;
            border-radius: 50%;
            font-weight: 900
        }

        .step.active {
            background: #ffce57;
            border-color: #fff0a5;
            color: #9e481e
        }

        .step.done {
            background: #2f8665;
            color: white
        }

        .panel {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            background: #f9ebc9;
            border: 4px solid #c08a4e;
            box-shadow: inset 0 0 0 3px #fff8e4;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 11px
        }

        .chapter {
            background: #0a604c;
            color: #fff9dc;
            border: 4px solid #e7b246;
            padding: 10px 14px;
            font-weight: 900;
            font-size: clamp(18px, 2.7vw, 26px)
        }

        .art {
            background: #e9d3a5;
            border: 5px solid #805536;
            aspect-ratio: 16/9;
            width: 100%;
            flex-shrink: 0;
            overflow: hidden
        }

        .art svg {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated
        }

        .question {
            background: #fff8e9;
            border: 3px solid #ba8752;
            padding: 12px 15px;
            line-height: 1.55;
            font-size: clamp(16px, 2.35vw, 22px);
            font-weight: 800
        }

        .options {
            display: grid;
            gap: 8px
        }

        .option {
            background: #fffaf0;
            border: 3px solid #b88956;
            padding: 10px 12px;
            min-height: 48px;
            display: flex;
            gap: 13px;
            align-items: center;
            text-align: left;
            font-size: clamp(15px, 2vw, 19px);
            font-weight: 750
        }

        .option.selected {
            background: #ffebad;
            border-color: #c67f22
        }

        .letter {
            display: grid;
            place-items: center;
            flex-shrink: 0;
            width: 34px;
            height: 34px;
            background: #2b79b2;
            border: 3px solid #15547f;
            color: white;
            font-weight: 900
        }

        .btn {
            width: 100%;
            border: 4px solid #90522a;
            background: linear-gradient(#ffd46c, #f5a12e);
            padding: 12px;
            color: #4e301f;
            font-size: clamp(16px, 2.4vw, 23px);
            font-weight: 1000;
            box-shadow: 0 4px #74452a
        }

        .btn:disabled {
            opacity: .45
        }

        .btn.green {
            background: linear-gradient(#70c6a3, #25876a);
            border-color: #18664f;
            color: white
        }

        .btn.secondary {
            background: #fff7df
        }

        .push {
            margin-top: auto
        }

        .knowledgewrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px
        }

        .knowledge {
            width: 94%;
            padding: clamp(22px, 4vw, 42px);
            background: linear-gradient(140deg, #fff6d7, #ffdfa0);
            border: 8px double #e4aa3e;
            box-shadow: 0 0 0 5px #81522e, 0 10px #5c3824;
            text-align: center;
            animation: flip .72s ease-out both
        }

        .answerstatus {
            font-weight: 900;
            font-size: clamp(15px, 2.3vw, 21px);
            margin-bottom: 14px;
            color: #167050
        }

        .answerstatus.wrong {
            color: #aa563d
        }

        .knowledge h2 {
            display: inline-block;
            background: #12644e;
            color: white;
            font-size: clamp(15px, 2.2vw, 22px);
            padding: 9px 18px;
            margin: 0 0 23px
        }

        .knowledge p {
            font-size: clamp(26px, 4.3vw, 42px);
            line-height: 1.5;
            font-weight: 1000;
            margin: 0;
            color: #6b3e21;
            text-wrap: balance
        }

        @keyframes flip {
            from {
                transform: rotateY(-90deg) scale(.87);
                opacity: .3
            }

            to {
                transform: rotateY(0) scale(1);
                opacity: 1
            }
        }

        .rank {
            background: linear-gradient(#ffe4a5, #f5be62);
            border: 6px double #b87932;
            padding: 20px;
            text-align: center
        }

        .rank h1 {
            font-size: clamp(38px, 6vw, 58px);
            margin: 6px
        }

        .rank .identity {
            font-size: clamp(34px, 5.5vw, 52px);
            font-weight: 1000;
            color: #8b491f
        }

        .rank .score {
            font-size: clamp(15px, 2vw, 21px)
        }

        .guide {
            display: flex;
            flex-direction: column;
            gap: 10px
        }

        .guidecard {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #fff9e7;
            border: 3px solid #b98753;
            padding: 13px;
            box-shadow: 3px 4px #d6b37d
        }

        .guidecard b {
            display: block;
            color: #075c4a;
            font-size: clamp(16px, 2.4vw, 22px);
            margin-bottom: 8px
        }

        .guidecard p {
            font-size: clamp(14px, 1.9vw, 18px);
            line-height: 1.6;
            margin: 0
        }

        .guideicon {
            width: 62px;
            min-width: 62px;
            height: 62px;
            display: grid;
            place-items: center;
            font-size: 31px;
            background: #f8e5b7;
            border: 3px solid #b98753;
            box-shadow: 2px 2px #d6b37d
        }

        .guidecopy {
            flex: 1;
            min-width: 0
        }

        .guidecard:nth-child(5) {
            grid-column: auto
        }

        .small {
            font-size: clamp(12px, 1.6vw, 15px);
            line-height: 1.5
        }

        .hero {
            text-align: center;
            padding: 20px;
            background: #0a654e;
            color: #fff6d4;
            border: 5px solid #e6b44b
        }

        .hero h1 {
            font-size: clamp(38px, 6vw, 62px);
            text-shadow: 4px 4px #a45b2d;
            margin: 12px 0
        }

        .hero p {
            font-size: clamp(18px, 2.7vw, 26px)
        }

        .introart {
            max-width: 100%
        }

        .notice {
            background: #fff8e7;
            border: 3px solid #c38c52;
            padding: 15px;
            font-size: clamp(16px, 2vw, 19px);
            line-height: 1.6
        }

        .survey {
            display: block;
            text-align: center;
            text-decoration: none;
            background: #23896c;
            color: white;
            border: 4px solid #14624e;
            padding: 15px;
            font-weight: 900;
            font-size: clamp(17px, 2.5vw, 23px)
        }

        @media(max-width:600px) {
            .app {
                padding: 6px;
                border-width: 3px;
                gap: 6px;
                aspect-ratio: auto;
                min-height: 100dvh;
                width: 100%
            }

            .panel {
                padding: 8px;
                gap: 8px
            }

            .top {
                padding: 6px
            }

            .steps {
                gap: 4px
            }

            .art {
                border-width: 3px
            }

            .guide {
                grid-template-columns: 1fr
            }

            .guidecard:nth-child(5) {
                grid-column: auto
            }
        }

        @media(prefers-reduced-motion:reduce) {
            .knowledge {
                animation: none
            }
        }

        /* V6: iPad 9 portrait kiosk layout and achievement polish */
        html,
        body {
            height: 100%;
            overflow: hidden
        }

        body {
            display: grid;
            place-items: center;
            background: radial-gradient(circle at 50% 15%, #f2e1c4, #b99c7a)
        }

        .app {
            width: min(100vw, calc(100dvh * .75), 810px);
            height: min(100dvh, calc(100vw * 4 / 3));
            aspect-ratio: 3/4;
            padding: 10px;
            gap: 8px;
            overflow: hidden
        }

        .top {
            flex-shrink: 0;
            min-height: 58px;
            padding: 7px 12px
        }

        .steps {
            gap: 7px
        }

        .step {
            width: 40px;
            height: 40px
        }

        .panel {
            overflow-y: auto;
            overscroll-behavior: contain;
            padding: 12px 18px;
            gap: 9px;
            scrollbar-width: thin
        }

        .chapter {
            font-size: clamp(18px, 2.3vw, 23px);
            padding: 8px 12px;
            flex-shrink: 0
        }

        .art {
            height: auto;
            aspect-ratio: 16/9;
            max-height: min(30dvh, 270px);
            flex-shrink: 1;
            min-height: 110px;
            display: grid;
            place-items: center
        }

        .art svg {
            width: 100%;
            height: 100%;
            object-fit: contain
        }

        .question {
            padding: 10px 13px;
            font-size: clamp(17px, 2.1vw, 21px)
        }

        .options {
            gap: 6px
        }

        .option {
            min-height: 43px;
            padding: 8px 10px;
            font-size: clamp(15px, 1.85vw, 18px)
        }

        .btn {
            min-height: 52px;
            padding: 9px
        }

        .push {
            position: sticky;
            bottom: 0;
            z-index: 2;
            background: #f9ebc9;
            padding-top: 6px;
            margin-top: auto
        }

        .knowledgewrap {
            min-height: 0
        }

        .knowledge {
            padding: clamp(15px, 3vw, 28px);
            max-height: 100%;
            overflow-y: auto
        }

        .knowledge h2 {
            margin-bottom: 14px
        }

        .knowledge p {
            font-size: clamp(25px, 3.6vw, 36px)
        }

        .rank {
            position: relative;
            overflow: hidden;
            padding: 16px 20px;
            background: linear-gradient(155deg, var(--rank-light, #fff1c9), var(--rank-dark, #e7b15c));
            border: 7px double var(--rank-border, #98672c);
            box-shadow: inset 0 0 0 5px #fff9e3, 0 5px #a37b50
        }

        .rank:before,
        .rank:after {
            content: '✦';
            position: absolute;
            color: var(--rank-border, #98672c);
            font-size: 42px;
            top: 18px
        }

        .rank:before {
            left: 16px
        }

        .rank:after {
            right: 16px
        }

        .rank .identity {
            font-size: clamp(44px, 6.7vw, 64px);
            line-height: 1.3;
            color: var(--rank-text, #76441f);
            text-shadow: 2px 3px #fff5d5
        }

        .rank .score {
            font-size: clamp(14px, 1.8vw, 18px);
            color: #74583e
        }

        .rank h1 {
            font-size: clamp(23px, 3.2vw, 32px)
        }

        .rank-sprite {
            width: 104px;
            height: 104px;
            margin: 0 auto 8px;
            display: grid;
            place-items: center;
            background: #fff5d8;
            border: 5px solid var(--rank-border, #98672c);
            box-shadow: 5px 5px #a27d52
        }

        .rank-sprite svg {
            width: 88px;
            height: 88px;
            image-rendering: pixelated
        }

        .guidehead {
            background: #0b634d;
            color: #fff5d5;
            border: 4px solid #e3af48;
            padding: 10px 14px;
            text-align: center;
            font-weight: 900;
            font-size: clamp(21px, 3vw, 30px);
            text-shadow: 2px 2px #194934
        }

        .guide {
            gap: 8px
        }

        .guidecard {
            padding: 9px 12px;
            gap: 13px;
            border-left: 9px solid #1b8667;
            background: linear-gradient(90deg, #fff4d4, #fffaf0)
        }

        .guidecard b {
            font-size: clamp(16px, 2.2vw, 21px);
            margin-bottom: 3px
        }

        .guidecard p {
            font-size: clamp(14px, 1.85vw, 18px);
            line-height: 1.45
        }

        .guideicon {
            width: 55px;
            min-width: 55px;
            height: 55px;
            font-size: 29px
        }

        .guidecard:nth-child(2) {
            border-left-color: #3d92b5
        }

        .guidecard:nth-child(3) {
            border-left-color: #c47745
        }

        .guidecard:nth-child(4) {
            border-left-color: #d4a33d
        }

        .guidecard:nth-child(5) {
            border-left-color: #8262a1
        }

        .guidecard {
            animation: rise .4s both
        }

        .guidecard:nth-child(2) {
            animation-delay: .07s
        }

        .guidecard:nth-child(3) {
            animation-delay: .14s
        }

        .guidecard:nth-child(4) {
            animation-delay: .21s
        }

        .guidecard:nth-child(5) {
            animation-delay: .28s
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(8px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        @media(max-width:600px) {

            html,
            body {
                overflow: auto
            }

            .app {
                height: 100dvh;
                min-height: 0;
                aspect-ratio: auto;
                width: 100%;
                padding: 5px
            }

            .panel {
                padding: 9px;
                gap: 7px
            }

            .top {
                min-height: 46px
            }

            .step {
                width: 29px;
                height: 29px;
                font-size: 11px;
                border-width: 2px
            }

            .art {
                max-height: 27dvh
            }

            .guidecard {
                padding: 8px
            }

            .guideicon {
                width: 45px;
                min-width: 45px;
                height: 45px;
                font-size: 24px
            }
        }

        @media(prefers-reduced-motion:reduce) {
            .guidecard {
                animation: none
            }
        }

        /* V7: locked 3:4 iPad portrait canvas; deluxe achievement only */
        .app {
            width: min(100vw, 75dvh, 810px) !important;
            height: min(100dvh, 133.333333vw, 1080px) !important;
            aspect-ratio: 3/4 !important;
            max-height: 100dvh;
            overflow: hidden
        }

        .panel {
            min-height: 0;
            overflow-y: auto
        }

        .achievement-stage {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 12px
        }

        .achievement-banner {
            flex-shrink: 0;
            background: linear-gradient(180deg, #0b765b, #07513f);
            border: 4px solid #eab957;
            box-shadow: inset 0 0 0 3px #fff3b6;
            text-align: center;
            padding: 10px;
            color: #fff5d7;
            font-weight: 1000;
            font-size: clamp(20px, 3vw, 29px)
        }

        .achievement-card {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            min-height: 0;
            flex: 1;
            max-height: 640px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(6px, 1.2vh, 16px);
            padding: clamp(12px, 2vh, 28px) 14px;
            background: radial-gradient(ellipse at 50% 32%, #fffbe7 0%, var(--card-light) 58%, var(--card-dark) 100%);
            border: 7px double var(--card-border);
            box-shadow: inset 0 0 0 5px #fff7df, 0 5px 0 #a37447;
            text-align: center
        }

        .achievement-card:before {
            content: '';
            position: absolute;
            inset: -50%;
            z-index: -1;
            background: repeating-conic-gradient(from 0deg at 50% 50%, #fff9d744 0deg 10deg, transparent 10deg 22deg);
            animation: slowspin 35s linear infinite
        }

        .achievement-card:after {
            content: '✦          ✧          ✦';
            position: absolute;
            top: 12%;
            left: 0;
            right: 0;
            color: #b78131;
            font-size: clamp(18px, 3vw, 30px);
            pointer-events: none
        }

        @keyframes slowspin {
            to {
                transform: rotate(360deg)
            }
        }

        .achievement-emblem {
            position: relative;
            width: clamp(90px, 14vh, 155px);
            height: clamp(90px, 14vh, 155px);
            flex-shrink: 0;
            display: grid;
            place-items: center;
            border: 7px ridge var(--card-border);
            background: linear-gradient(140deg, #fff9d7, var(--card-light));
            box-shadow: 6px 7px 0 #9b6d3c
        }

        .achievement-emblem svg {
            width: 80%;
            height: 80%;
            image-rendering: pixelated
        }

        .achievement-laurel {
            position: absolute;
            inset: -20px -62px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: clamp(44px, 7vh, 70px);
            font-weight: 1000;
            color: var(--card-border);
            pointer-events: none;
            text-shadow: 2px 3px #fff2be
        }

        .achievement-laurel span:first-child {
            transform: scaleX(-1)
        }

        .achievement-title {
            position: relative;
            z-index: 1;
            max-width: 100%;
            font-size: clamp(40px, 7.1vw, 73px);
            line-height: 1.2;
            letter-spacing: 1px;
            font-weight: 1000;
            color: #ffe9a2;
            -webkit-text-stroke: clamp(1.5px, .35vw, 3px) #5c321c;
            text-shadow: 0 3px #bd712f, 0 6px #753a21, 3px 9px #4e2b1c, 0 0 12px #fff1ae;
            filter: drop-shadow(0 2px 0 #fff3bd);
            overflow-wrap: anywhere
        }

        .achievement-subtitle {
            font-size: clamp(19px, 3.2vw, 29px);
            font-weight: 1000;
            color: #fff6d9;
            text-shadow: 2px 2px #714225, -1px -1px #714225;
            background: linear-gradient(90deg, #80512f, #a36d3b, #80512f);
            border: 3px solid #e9bb62;
            padding: 7px 15px;
            max-width: 100%
        }

        .achievement-score {
            font-size: clamp(13px, 1.9vw, 18px);
            font-weight: 700;
            color: #79583e;
            line-height: 1.4
        }

        .achievement-action {
            flex-shrink: 0
        }

        @media(max-width:600px) {
            .achievement-card {
                padding: 10px
            }

            .achievement-title {
                font-size: clamp(32px, 7.5vw, 48px)
            }

            .achievement-subtitle {
                font-size: clamp(16px, 3.6vw, 22px)
            }

            .achievement-emblem {
                width: clamp(80px, 15vh, 118px);
                height: clamp(80px, 15vh, 118px)
            }

            .achievement-laurel {
                inset: -15px -42px;
                font-size: 42px
            }
        }

        @media(prefers-reduced-motion:reduce) {
            .achievement-card:before {
                animation: none
            }
        }

        /* V8: legible premium pixel-achievement typography, fixed portrait stage */
        .achievement-stage {
            gap: 9px
        }

        .achievement-banner {
            padding: 8px;
            font-size: clamp(19px, 2.8vw, 26px)
        }

        .achievement-card {
            gap: clamp(8px, 1.5vh, 15px);
            padding: clamp(12px, 2.3vh, 25px) 14px
        }

        .achievement-card:before {
            animation: none;
            inset: -40%;
            opacity: .55
        }

        .achievement-card:after {
            content: '✦     ✧     ✦';
            top: 10%;
            font-size: clamp(19px, 3vw, 30px)
        }

        .achievement-emblem {
            width: clamp(104px, 16vh, 154px);
            height: clamp(104px, 16vh, 154px);
            margin-bottom: 8px;
            box-shadow: 5px 6px 0 #93663d
        }

        .achievement-laurel {
            inset: -16px -52px;
            font-size: clamp(46px, 7vh, 67px)
        }

        .achievement-title {
            font-size: clamp(39px, 6.1vw, 61px);
            font-weight: 1000;
            line-height: 1.23;
            letter-spacing: 0;
            color: #ffe09a;
            -webkit-text-stroke: 0;
            text-shadow: none;
            filter: none;
            overflow-wrap: normal;
            white-space: nowrap;
            max-width: 100%;
            transform: none
        }

        .achievement-title-text {
            display: block;
            position: relative;
            z-index: 1;
            padding: 4px 8px 7px;
            background: linear-gradient(180deg, #fff5b9 2%, #ffdd76 43%, #e9a941 65%, #bd752d 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(1px 2px 0 #75451f)
        }

        .achievement-ribbon {
            position: relative;
            max-width: 94%;
            padding: 8px 22px;
            background: linear-gradient(180deg, var(--ribbon-top, #96603c), var(--ribbon-bottom, #704226));
            border: 3px solid #eac16d;
            box-shadow: 0 4px 0 #7a4a2c;
            color: #fff6d9;
            font-size: clamp(17px, 2.8vw, 26px);

        function art(i) { return `<div class="art slot-art" data-scene="${i}"><div class="slot-empty"><span class="slot-icon">▧</span><strong>關卡 ${String(i + 1).padStart(2, '0')} 圖片預留區</strong><small>1200 × 480 px｜PNG｜無文字</small></div><img class="scene-img" src="${scenePreview[i] || `assets/scene_${i + 1}.png`}" alt="第${i + 1}關場景圖片" onload="this.parentElement.classList.add('has-image')" onerror="this.parentElement.classList.remove('has-image')"></div>` }
        const scenePreview = {};
        function go(s) { screen = s; render() }
        function reset() { step = 0; picked = -1; score = 0; go('intro') }
        function render() {
            if (screen === 'intro') { app.innerHTML = head() + `<section class="panel"><div class="hero"><h1>節能營業中！</h1><p>今天換你當店長！</p></div>${art(0)}<div class="question" style="text-align:center">五個經營決策，帶走五項節能小知識！</div><div class="push"><button class="btn" id="start">開始營業 ▶</button></div></section>`; document.getElementById('start').onclick = () => go('question'); return }
            if (screen === 'question') { let q = Q[step]; app.innerHTML = head() + `<section class="panel"><div class="chapter">任務 ${String(step + 1).padStart(2, '0')}｜${q.stage}</div>${art(step)}<div class="question">${q.q}</div><div class="options">${q.opts.map((o, i) => `<button class="option ${picked === i ? 'selected' : ''}" data-choice="${i}"><span class="letter">${'ABC'[i]}</span><span>${o}</span></button>`).join('')}</div><div class="push"><button class="btn" id="confirm" ${picked < 0 ? 'disabled' : ''}>確認我的決策 ▶</button></div></section>`; app.querySelectorAll('[data-choice]').forEach(b => b.onclick = () => { picked = Number(b.dataset.choice); render() }); app.querySelector('#confirm').onclick = () => { lastCorrect = picked === q.correct; if (lastCorrect) score += 20; go('tip') }; return }
            if (screen === 'tip') { let q = Q[step]; app.innerHTML = head() + `<section class="panel"><div class="chapter">任務 ${String(step + 1).padStart(2, '0')}｜節能小知識</div><div class="tip-scene">${art(step)}</div><div class="knowledgewrap"><div class="knowledge"><div class="answerstatus ${lastCorrect ? '' : 'wrong'}">${lastCorrect ? '✓ 答對了！' : '✕ 答錯了！'}</div><h2>✦ 節能小知識 ✦</h2><p>${q.tip}</p></div></div><div class="push"><button class="btn" id="next">${step === 4 ? '查看我的成就' : '下一個任務'} ▶</button></div></section>`; app.querySelector('#next').onclick = () => { if (step === 4) go('result'); else { step++; picked = -1; go('question') } }; return }
            if (screen === 'result') {
                let rank = score === 100 ? '永續行動家' : score >= 60 ? '低碳實踐家' : '節能見習生';
                let sub = score === 100 ? '節能從我做起，打造永續未來！' : score >= 60 ? '從日常行動，累積節能力！' : '節能技能學習中！';
                let theme = score === 100 ? ['#fff4c6', '#e6b85a', '#c3912e'] : score >= 60 ? ['#e9f4da', '#a6d1a0', '#4e9968'] : ['#f8e6c9', '#ddb27c', '#b57a3d'];
                let outfit = score === 100 ? '#d6a133' : score >= 60 ? '#348d64' : '#c77747';
                let sprite = `<svg viewBox="0 0 88 88" shape-rendering="crispEdges" aria-label="像素店長徽章"><rect x="21" y="5" width="46" height="12" fill="#fff9ed"/><rect x="28" y="0" width="32" height="7" fill="#f3cb66"/><rect x="17" y="16" width="54" height="9" fill="#fff9ed"/><rect x="22" y="25" width="44" height="25" fill="#f2c39a"/><rect x="18" y="50" width="52" height="26" fill="${outfit}"/><rect x="30" y="50" width="28" height="19" fill="#fff6dd"/><rect x="22" y="76" width="17" height="10" fill="#584332"/><rect x="49" y="76" width="17" height="10" fill="#584332"/><rect x="9" y="53" width="12" height="17" fill="#f2c39a"/><rect x="67" y="53" width="12" height="17" fill="#f2c39a"/></svg>`;
                app.innerHTML = head() + `<section class="panel"><div class="achievement-stage"><div class="achievement-banner">恭喜完成五項節能挑戰 · ${score} / 100 分</div><div class="achievement-card" style="--card-light:${theme[0]};--card-dark:${theme[1]};--card-border:${theme[2]};--ribbon-top:${score === 100 ? "#b9472c" : score >= 60 ? "#148166" : "#95623f"};--ribbon-bottom:${score === 100 ? "#87351f" : score >= 60 ? "#0a5648" : "#714329"}"><div class="achievement-image-slot"><div class="achievement-image-placeholder" aria-hidden="true"><span>▧</span><strong>成就卡牌圖片預留區</strong><small>1200 × 480 px｜PNG｜5:2</small></div><img class="achievement-image" src="assets/card_${score === 100 ? 1 : score >= 60 ? 2 : 3}.png" alt="成就卡牌插圖" onload="this.parentElement.classList.add('loaded')" onerror="this.parentElement.classList.remove('loaded')"></div></div></div><div class="push achievement-action"><button class="btn" id="guide">領取我的節能經營指南 ▶</button></div></section>`;
                app.querySelector('#guide').onclick = () => go('guide'); return
            }
            if (screen === 'guide') { app.innerHTML = head() + `<section class="panel"><div class="guidehead">✦ 店長的五大節能祕笈 ✦</div><div class="guide">${Q.map((q, i) => `<div class="guidecard"><div class="guideicon" aria-hidden="true">${['❄️', '🧊', '🍳', '💡', '📊'][i]}</div><div class="guidecopy"><b>${String(i + 1).padStart(2, '0')}｜${q.title}</b><p>${q.tip}</p></div></div>`).join('')}</div><div class="push"><button class="btn" id="finish">完成挑戰，領取好禮 ▶</button></div></section>`; app.querySelector('#finish').onclick = () => go('finish'); return }
            app.innerHTML = head() + `<section class="panel"><div class="chapter">🎁 任務完成！</div><div class="hero"><h1>🌎節能挑戰成功！🌎</h1><p>帶著五個節能祕笈，開始行動！</p></div><div class="notice"><b>你的企業，也想開始節能嗎？</b><br>有用電分析、節能輔導或設備改善需求，歡迎留下聯絡方式，訂閱相關資訊。</div><a class="survey" href="https://forms.cloud.microsoft/r/ZZRJWgqdTM" target="_blank" rel="noopener noreferrer">我有節能需求，填寫問卷 ↗</a><div class="notice" style="background:#e7f0db;text-align:center">🎁 出示此完成畫面，即可領取永續行動禮。</div><div class="push"><button class="btn" id="again">↻ 下一位店長</button></div></section>`; app.querySelector('#again').onclick = () => { if (confirm('確定要清除本次成績，讓下一位店長開始嗎？')) reset() };
        }
        if (location.hash.startsWith('#preview=')) { const level = location.hash.split('=')[1]; if (level === 'question') { step = 0; screen = 'question' } else if (level === 'tip') { step = 0; lastCorrect = true; screen = 'tip' } else { step = 4; score = level === 'gold' ? 100 : level === 'green' ? 80 : 40; screen = 'result' } }
        render();
    </script>
